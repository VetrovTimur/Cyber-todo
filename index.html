<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Todo</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00ffd5"><link rel="stylesheet" href="css/style-2c24a23cb3.css"></head><body class="tasker-body"><header class="tasker-header"><div class="tasker-header__inner container"><h1 class="tasker-header__logo">CYBER TODO</h1><button type="button" id="logout-btn" class="tasker-header__logout">Выйти</button></div></header><nav class="main-nav"><button class="main-nav__btn active" data-tab="tasks" type="button">Задачи</button> <button class="main-nav__btn" data-tab="shopping" type="button">Покупки</button> <button class="main-nav__btn" data-tab="holidays" type="button">Праздники</button> <button class="main-nav__btn" data-tab="projects" type="button">Проекты</button></nav><main class="container"><!-- Вкладка: Задачи --><section id="tab-tasks" class="tab-content active"><div class="tasker"><section class="tasker__add-section"><form id="add-task-form" class="task-form"><textarea id="task-input" placeholder="Что нужно сделать?" required autocomplete="off" rows="1"></textarea> <input type="date" id="task-deadline" class="task-form__date" title="Выберите дату (необязательно)"><div class="custom-select" id="task-category-wrapper"><input type="hidden" id="task-category" value="personal"><div class="custom-select__trigger"><span class="custom-select__value">Личное</span> <span class="custom-select__arrow">▼</span></div><ul class="custom-select__options"><li class="custom-select__option active" data-value="personal">Личное</li><li class="custom-select__option" data-value="work">Работа</li><li class="custom-select__option" data-value="home">Дом</li></ul></div><button type="submit" class="task-form__btn">Добавить</button></form></section><section class="tasker__list-section"><div class="task-filters"><div class="task-filters__group"><button class="task-filters__btn active" data-filter-status="all" type="button">Все</button> <button class="task-filters__btn" data-filter-status="active" type="button">Активные</button> <button class="task-filters__btn" data-filter-status="completed" type="button">Выполненные</button></div><div class="task-filters__group"><button class="task-filters__btn active" data-filter-category="all" type="button">Все категории</button> <button class="task-filters__btn" data-filter-category="work" type="button">Работа</button> <button class="task-filters__btn" data-filter-category="home" type="button">Дом</button> <button class="task-filters__btn" data-filter-category="personal" type="button">Личное</button></div></div><div id="task-loader" class="task-loader">Загрузка задач...</div><ul id="task-list" class="task-list"><li class="task-list__empty hidden" id="empty-message">Нет задач по выбранным фильтрам.</li></ul></section></div></section><!-- Вкладка: Покупки --><section id="tab-shopping" class="tab-content"><div class="shopping-container"><section class="shopping__add-section"><form id="add-shopping-form" class="shopping-form"><input type="text" id="shopping-input-name" placeholder="Что купить?" required autocomplete="off"> <input type="number" id="shopping-input-qty" placeholder="Кол-во" min="1" value="1"> <button type="submit" class="shopping-form__btn">Добавить</button></form></section><section class="shopping__list-section"><ul id="shopping-list" class="shopping-list"><li class="shopping-list__empty" id="shopping-empty-message">Список покупок пуст. Самое время добавить!</li></ul></section></div></section><!-- Вкладка: Праздники --><section id="tab-holidays" class="tab-content"><div class="holidays-container"><!-- Шапка календаря --><div class="calendar-header"><button type="button" id="prev-month" class="calendar-header__btn">←</button><h2 id="current-month" class="calendar-header__title">Месяц</h2><button type="button" id="next-month" class="calendar-header__btn">→</button></div><!-- Сетка дней недели --><div class="calendar-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><!-- Сама сетка с числами (генерируется через JS) --><div id="calendar-grid" class="calendar-grid"><!-- Тут будут появляться дни --></div><!-- Форма добавления события --><form id="add-holiday-form" class="holiday-form"><input type="text" id="holiday-title" placeholder="Название события" required autocomplete="off"> <input type="date" id="holiday-date" required> <select id="holiday-type"><option value="holiday">Праздник</option><option value="birthday">День рождения</option><option value="death">День памяти</option></select> <button type="submit" class="holiday-form__btn">Добавить</button></form><!-- Список событий на выбранный день --><div class="holiday-events"><h3 id="selected-date-title" class="holiday-events__title">Выберите день в календаре</h3><ul id="holiday-list" class="holiday-list"><!-- События будут появляться здесь --></ul></div></div></section><!-- Вкладка: Проекты --><section id="tab-projects" class="tab-content"><div class="tab-placeholder"><div class="tab-placeholder__icon">🚧</div><h2 class="tab-placeholder__title">В разработке</h2><p class="tab-placeholder__text">Скоро здесь появится раздел для управления твоими проектами.</p></div></section></main><script src="js/main-98626506b1.js"></script></body></html>
