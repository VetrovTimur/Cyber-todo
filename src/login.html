<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Cyber Todo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffd5">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
      <main class="auth container">
        <h1 class="auth__title">Вход в систему</h1>

        <form class="auth__form" id="login-form">
          <div class="auth__field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Введите логин">
          </div>

          <div class="auth__field">
            <label for="password">Пароль</label>
            <input type="password" id="password" required placeholder="Введите пароль" autocomplete="current-password">
          </div>

          <div class="auth__remember">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Запомнить меня</label>
          </div>

          <button type="submit" class="auth__submit">Войти</button>

          <p class="auth__error" id="login-error" style="color: #ff4d4d; display: none; margin-top: 15px;"></p>
        </form>
      </main>

      <script src="js/main.js"></script>
  </body>
</html>
