<div class="shopping-container">
    <section class="shopping__add-section">
        <form id="add-shopping-form" class="shopping-form">
            <input type="text" id="shopping-input-name" placeholder="Что купить?" required autocomplete="off">
            <input type="number" id="shopping-input-qty" placeholder="Кол-во" min="1" value="1">
            <button type="submit" class="shopping-form__btn">Добавить</button>
        </form>
    </section>

    <section class="shopping__list-section">
        <ul id="shopping-list" class="shopping-list">
            <li class="shopping-list__empty" id="shopping-empty-message">Список покупок пуст. Самое время добавить!</li>
        </ul>
    </section>
</div>
