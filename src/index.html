<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Todo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffd5">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tasker-body">

    @@include('parts/header.html')
    @@include('parts/nav.html')

    <main class="container">

        <!-- Вкладка: Задачи -->
        <section id="tab-tasks" class="tab-content active">
            @@include('parts/tab-tasks.html')
        </section>

        <!-- Вкладка: Покупки -->
        <section id="tab-shopping" class="tab-content">
            @@include('parts/tab-shopping.html')
        </section>

        <!-- Вкладка: Праздники -->
        <section id="tab-holidays" class="tab-content">
            @@include('parts/tab-holidays.html')
        </section>

        <!-- Вкладка: Проекты -->
        <section id="tab-projects" class="tab-content">
            @@include('parts/tab-projects.html')
        </section>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
