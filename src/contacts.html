<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Контакты — Gulp Starter">
    <!-- preload-fonts -->
    <!-- critical-css -->
    <link rel="stylesheet" href="css/style.css">
    <!-- og-tags -->
    <!-- schema -->
    <title>Контакты — Gulp Starter</title>
    @@include('favicon.html')
</head>
<body>
    @@include('parts/header.html')

    <main class="container">
        <section class="page-header">
            <h1 class="page-header__title">Контакты</h1>
            <p class="page-header__text">Свяжитесь с нами удобным способом</p>
        </section>

        <section class="contacts">
            <div class="contacts__item">
                <h3 class="contacts__label">Email</h3>
                <a href="mailto:hello@example.com" class="contacts__value">hello@example.com</a>
            </div>
            <div class="contacts__item">
                <h3 class="contacts__label">Телефон</h3>
                <a href="tel:+79991234567" class="contacts__value">+7 (999) 123-45-67</a>
            </div>
            <div class="contacts__item">
                <h3 class="contacts__label">Адрес</h3>
                <p class="contacts__value">Москва, ул. Примерная, д. 1</p>
            </div>
        </section>

        <section class="contacts-form-block">
            <h2 class="contacts-form-block__title">Написать нам</h2>
            <form class="contacts-form" data-contact-form>
                <div class="contacts-form__field">
                    <label for="name" class="contacts-form__label">Имя</label>
                    <input type="text" id="name" name="name" class="contacts-form__input" required>
                </div>
                <div class="contacts-form__field">
                    <label for="email" class="contacts-form__label">Email</label>
                    <input type="email" id="email" name="email" class="contacts-form__input" required>
                </div>
                <div class="contacts-form__field">
                    <label for="message" class="contacts-form__label">Сообщение</label>
                    <textarea id="message" name="message" rows="5" class="contacts-form__textarea" required></textarea>
                </div>
                <button type="submit" class="btn btn--primary">Отправить</button>
            </form>
            <p class="contacts-form__result" data-form-result></p>
        </section>
    </main>

    <footer class="footer">
        <p>Gulp Starter · <span data-year></span></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
