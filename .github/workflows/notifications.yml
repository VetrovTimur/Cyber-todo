name: Cyber Todo Notifications

on:
  schedule:
    # Запуск ровно в 6:00, 9:00, 15:00 и 23:00 по Москве (в UTC это 3, 6, 12, 20)
    - cron: '0 3,6,12,20 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой на GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Устанавливаем зависимости бэкенда
        run: |
          cd backend
          npm install

      - name: Запускаем скрипт уведомлений
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd backend
          node index.js
